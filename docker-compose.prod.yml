version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: promata-postgres-prod
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-senha_super_segura_123}
      POSTGRES_DB: promata_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - promata_prod

  minio:
    image: minio/minio:latest
    container_name: promata-minio-prod
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API S3 (pode remover se acesso só interno)
      - "9001:9001"   # Console web do MinIO
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - promata_prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.promata-storage.rule=Host(`storage.promata.com.br`)"
      - "traefik.http.routers.promata-storage.entrypoints=websecure"
      - "traefik.http.routers.promata-storage.tls=true"
      - "traefik.http.routers.promata-storage.tls.certresolver=letsencrypt"
      - "traefik.http.services.promata-storage.loadbalancer.server.port=9000"

  minio-init:
    image: minio/mc:latest
    container_name: promata-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin123};
      mc mb local/${AWS_S3_BUCKET:-promata-bucket} --ignore-existing;
      mc anonymous set download local/${AWS_S3_BUCKET:-promata-bucket};
      exit 0;
      "
    networks:
      - promata_prod

  backend:
    image: experimentanaturalmente/pro-mata-backend:latest
    container_name: promata-backend-prod
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-senha_super_segura_123}@postgres:5432/promata_db
      JWT_SECRET: ${JWT_SECRET}
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      AWS_S3_REGION: us-east-1
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-promata-bucket}
      # Endpoint interno usado pelo SDK para falar com o MinIO via rede docker
      AWS_S3_ENDPOINT: http://minio:9000
      # URL pública usada para montar os links dos arquivos (acessível pelo navegador)
      AWS_S3_PUBLIC_URL: ${AWS_S3_PUBLIC_URL}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASS: ${MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
      FRONTEND_URL: ${FRONTEND_URL}
    ports:
      - "3000:3000"
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - promata_prod
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.promata-api.rule=Host(`api.promata.com.br`)"
      - "traefik.http.routers.promata-api.entrypoints=websecure"
      - "traefik.http.routers.promata-api.tls=true"
      - "traefik.http.routers.promata-api.tls.certresolver=letsencrypt"
      - "traefik.http.services.promata-api.loadbalancer.server.port=3000"

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  promata_prod:
    driver: bridge